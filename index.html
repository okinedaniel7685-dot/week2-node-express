<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Week 2 API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.6;
      background: #f5f7fb;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    code {
      background: #eef1f5;
      padding: 3px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Week 2 API!</h1>
    <p>Your Express API is running successfully.</p>

    <h2>Available Routes</h2>
    <ul>
      <li><code>GET /api</code> — API welcome message</li>
      <li><code>POST /user</code> — Create/greet a user</li>
      <li><code>GET /user/:id</code> — View a user profile</li>
    </ul>

    <h2>Example</h2>
    <p>Try <code>/user/1</code> in your browser.</p>
  </div>
</body>
</html>
